# ~/.config/tmux/tmux.conf (linked from dotfiles/config/.config/tmux)

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,xterm*:extkeys"
set -g focus-events on
# Keep <Esc> snappy in Neovim
set -sg escape-time 10

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# ── Key bindings ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Split / new window in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Claude
set -g allow-passthrough on
set -s extended-keys on

# ── Machine-local overrides (not tracked) ─────────────────────────────────────
source-file -q ~/.config/tmux/tmux.local.conf
